<script>

/* =========================================
   VIEW STUDENT
   ========================================= */

function viewStudent(id) {

  const student = students.find(function(item) {
    return item.id == id;
  });

  if (!student) {
    alert("Student not found.");
    return;
  }

  const details = document.getElementById("studentDetails");

  if (details) {
    details.innerHTML = `
      <p><strong>Name:</strong> ${escapeHTML(student.name || "")}</p>
      <p><strong>Phone:</strong> ${escapeHTML(student.phone || "")}</p>
      <p><strong>Email:</strong> ${escapeHTML(student.email || "")}</p>
      <p><strong>Age:</strong> ${escapeHTML(String(student.age || ""))}</p>
      <p><strong>Gender:</strong> ${escapeHTML(student.gender || "")}</p>
      <p><strong>Course:</strong> ${escapeHTML(student.course || "")}</p>
      <p><strong>City:</strong> ${escapeHTML(student.city || "")}</p>
      <p><strong>Message:</strong> ${escapeHTML(student.message || "")}</p>
      <p><strong>Registered:</strong> ${escapeHTML(student.registeredAt || "")}</p>
    `;
  }

  const viewModal = document.getElementById("viewModal");

  if (viewModal) {
    viewModal.style.display = "block";
  }
}


/* =========================================
   CLOSE VIEW MODAL
   ========================================= */

function closeViewModal() {

  const viewModal = document.getElementById("viewModal");

  if (viewModal) {
    viewModal.style.display = "none";
  }
}


/* =========================================
   EDIT STUDENT
   ========================================= */

function editStudent(id) {

  const student = students.find(function(item) {
    return item.id == id;
  });

  if (!student) {
    alert("Student not found.");
    return;
  }

  const editId = document.getElementById("editId");
  const editName = document.getElementById("editName");
  const editPhone = document.getElementById("editPhone");
  const editEmail = document.getElementById("editEmail");
  const editAge = document.getElementById("editAge");
  const editGender = document.getElementById("editGender");
  const editCourse = document.getElementById("editCourse");
  const editCity = document.getElementById("editCity");
  const editMessage = document.getElementById("editMessage");

  if (editId) editId.value = String(student.id);
  if (editName) editName.value = student.name || "";
  if (editPhone) editPhone.value = student.phone || "";
  if (editEmail) editEmail.value = student.email || "";
  if (editAge) editAge.value = String(student.age || "");
  if (editGender) editGender.value = student.gender || "";
  if (editCourse) editCourse.value = student.course || "";
  if (editCity) editCity.value = student.city || "";
  if (editMessage) editMessage.value = student.message || "";

  const editModal = document.getElementById("editModal");

  if (editModal) {
    editModal.style.display = "block";
  }
}


/* =========================================
   EDIT FORM SUBMIT
   ========================================= */

const editForm = document.getElementById("editForm");

if (editForm) {

  editForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const editId = document.getElementById("editId");

    if (!editId) {
      return;
    }

    const id = editId.value;

    const index = students.findIndex(function(student) {
      return student.id == id;
    });

    if (index === -1) {
      alert("Student not found.");
      return;
    }

    const editName = document.getElementById("editName");
    const editPhone = document.getElementById("editPhone");
    const editEmail = document.getElementById("editEmail");
    const editAge = document.getElementById("editAge");
    const editGender = document.getElementById("editGender");
    const editCourse = document.getElementById("editCourse");
    const editCity = document.getElementById("editCity");
    const editMessage = document.getElementById("editMessage");

    if (editName) students[index].name = editName.value;
    if (editPhone) students[index].phone = editPhone.value;
    if (editEmail) students[index].email = editEmail.value;
    if (editAge) students[index].age = editAge.value;
    if (editGender) students[index].gender = editGender.value;
    if (editCourse) students[index].course = editCourse.value;
    if (editCity) students[index].city = editCity.value;
    if (editMessage) students[index].message = editMessage.value;

    saveStudents();
    updateStatistics();
    displayStudents(students);
    displayCourseStatistics();
    closeEditModal();

    alert("Student updated successfully.");
  });
}


/* =========================================
   CLOSE EDIT MODAL
   ========================================= */

function closeEditModal() {

  const editModal = document.getElementById("editModal");

  if (editModal) {
    editModal.style.display = "none";
  }
}


/* =========================================
   DELETE STUDENT
   ========================================= */

function deleteStudent(id) {

  const student = students.find(function(item) {
    return item.id == id;
  });

  if (!student) {
    alert("Student not found.");
    return;
  }

  const confirmed = confirm(
    "Delete " + (student.name || "student") + "?"
  );

  if (!confirmed) {
    return;
  }

  students = students.filter(function(item) {
    return item.id != id;
  });

  saveStudents();
  updateStatistics();
  displayStudents(students);
  displayCourseStatistics();
}


/* =========================================
   DELETE ALL STUDENTS
   ========================================= */

function deleteAllStudents() {

  if (students.length === 0) {
    alert("There are no students to delete.");
    return;
  }

  const confirmed = confirm(
    "Are you sure you want to delete ALL students?"
  );

  if (!confirmed) {
    return;
  }

  students = [];

  localStorage.removeItem("edeStudents");

  updateStatistics();
  displayStudents(students);
  displayCourseStatistics();

  alert("All students have been deleted.");
}


/* =========================================
   LOGOUT
   ========================================= */

function logout() {

  localStorage.removeItem("edeAdminLoggedIn");

  window.location.href = "login.html";
}


/* =========================================
   EXPOSE FUNCTIONS TO WINDOW
   ========================================= */

window.viewStudent = viewStudent;
window.closeViewModal = closeViewModal;
window.editStudent = editStudent;
window.closeEditModal = closeEditModal;
window.deleteStudent = deleteStudent;
window.deleteAllStudents = deleteAllStudents;
window.logout = logout;


/* =========================================
   CLOSE MODALS WHEN CLICKING OUTSIDE
   ========================================= */

window.addEventListener("click", function(event) {

  const viewModal = document.getElementById("viewModal");
  const editModal = document.getElementById("editModal");

  if (event.target === viewModal) {
    closeViewModal();
  }

  if (event.target === editModal) {
    closeEditModal();
  }

});

</script>
