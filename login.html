<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Ethio-Digital Excellence</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .logo {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #0b3d91;
      margin-bottom: 8px;
    }

    .title {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #0b3d91;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #0b3d91;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #072c6b;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0b3d91;
      text-decoration: none;
    }

    .error {
      color: #d32f2f;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      Ethio-Digital Excellence
    </div>

    <p class="title">
      Admin Login
    </p>

    <form id="loginForm">

      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Enter username"
          required>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required>

      </div>


      <button type="submit">
        Login
      </button>

    </form>


    <p id="errorMessage" class="error">
      Incorrect username or password.
    </p>


    <a href="index.html" class="back">
      ← Back to Home
    </a>

  </div>


  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
          document.getElementById("username").value;

        const password =
          document.getElementById("password").value;


        /*
          TEMPORARY LOGIN
          We will make this secure later
        */

        if (
          username === "admin" &&
          password === "12345"
        ) {

          localStorage.setItem(
            "edeAdminLoggedIn",
            "true"
          );

          window.location.href = "admin.html";

        } else {

          document
            .getElementById("errorMessage")
            .style.display = "block";

        }

      });

  </script>

</body>
</html>
