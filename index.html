<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ethio-Digital Excellence</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        /* HEADER */

        header {
            background: #0b3d91;
            color: white;
            padding: 18px 20px;
        }

        .header-container {
            max-width: 1100px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* HERO */

        .hero {
            background: linear-gradient(
                135deg,
                #0b3d91,
                #1976d2
            );

            color: white;
            text-align: center;

            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 18px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }


        /* BUTTON */

        .btn {
            display: inline-block;

            background: white;
            color: #0b3d91;

            text-decoration: none;

            padding: 14px 25px;

            border-radius: 8px;

            font-weight: bold;

            margin: 5px;
        }

        .btn:hover {
            opacity: 0.9;
        }


        /* MAIN SECTIONS */

        .section {
            max-width: 1100px;
            margin: auto;
            padding: 55px 20px;
        }

        .section-title {
            text-align: center;
            color: #0b3d91;
            font-size: 30px;
            margin-bottom: 35px;
        }


        /* COURSES */

        .courses {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 20px;
        }

        .course-card {
            background: white;

            padding: 25px 20px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);
        }

        .course-number {
            width: 36px;
            height: 36px;

            margin: 0 auto 12px;

            border-radius: 50%;

            background: #0b3d91;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        .course-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .course-card h3 {
            color: #0b3d91;
            margin-bottom: 10px;
            font-size: 19px;
        }

        .course-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }


        /* ABOUT */

        .about {
            background: white;
        }

        .about-content {
            max-width: 850px;
            margin: auto;

            text-align: center;

            color: #555;

            line-height: 1.7;

            font-size: 16px;
        }


        /* REGISTER */

        .register-section {
            background: #eaf2ff;
            text-align: center;
        }

        .register-section p {
            max-width: 700px;
            margin: 0 auto 25px;

            color: #555;
        }

        .primary-btn {
            background: #0b3d91;
            color: white;
        }


        /* FOOTER */

        footer {
            background: #0b3d91;
            color: white;

            text-align: center;

            padding: 25px 15px;
        }

        footer p {
            margin: 5px;
            font-size: 14px;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .header-container {
                flex-direction: column;
                text-align: center;
            }

            nav {
                justify-content: center;
                gap: 12px;
            }

            nav a {
                font-size: 14px;
            }

            .hero {
                padding: 65px 15px;
            }

            .hero h1 {
                font-size: 31px;
            }

            .hero p {
                font-size: 17px;
            }

            .section {
                padding: 45px 15px;
            }

            .section-title {
                font-size: 26px;
            }

        }

    </style>
</head>


<body>


    <!-- HEADER -->

    <header>

        <a

        <a
